[workspace]
resolver = "2"
members = [
    "crates/audiofuse-core",
    "crates/audiofuse-cli",
    "crates/audiofuse-gui",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["AudioFuse Linux Control Center Contributors"]
repository = "https://github.com/LDLNAN/AudiofuseLinuxControlCenter"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rusb = "0.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
