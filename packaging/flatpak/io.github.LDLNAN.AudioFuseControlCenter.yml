app-id: io.github.LDLNAN.AudioFuseControlCenter
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: audiofuse-control-center
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=xdg-documents
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/audiofuse-control-center/cargo
modules:
  - name: audiofuse-control-center
    buildsystem: simple
    build-commands:
      - cargo build --frozen --release --workspace
      - install -Dm755 target/release/audiofuse-control-center /app/bin/audiofuse-control-center
      - install -Dm755 target/release/audiofuse-cli /app/bin/audiofuse-cli
      - install -Dm644 udev/70-arturia-audiofuse.rules /app/lib/udev/rules.d/70-arturia-audiofuse.rules
      - install -Dm644 packaging/audiofuse-control-center.desktop /app/share/applications/io.github.LDLNAN.AudioFuseControlCenter.desktop
      - sed -i s/^Icon=.*/Icon=io.github.LDLNAN.AudioFuseControlCenter/ /app/share/applications/io.github.LDLNAN.AudioFuseControlCenter.desktop
      - install -Dm644 packaging/audiofuse-control-center.svg /app/share/icons/hicolor/scalable/apps/io.github.LDLNAN.AudioFuseControlCenter.svg
    sources:
      - type: archive
        path: ../../dist/audiofuse-control-center-1.0.0.tar.gz
